name: CI

on:
  push:
    branches: [main]
  pull_request:

# 2026-10 安全审计：本 workflow 只需只读权限，显式收敛（原先继承仓库默认，可能 read-write）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 2026-10 安全审计：action 已固定到 commit SHA（可移动标签 v4/v5 存在上游投毒 → CI 内任意代码执行的风险）
      # 升级方式：gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'（务必确认 object.type=commit，annotated tag 需再解引用）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: 公开仓库卫生门禁（内部/商业文档不得入库）
        run: python tools/check_repo_hygiene.py
      - name: Build (ui/index.html + engine/engine.dist.js)
        run: python tools/build_ui.py
      - name: Committed artifacts must match a fresh build（"dist 勿手改"红线由机器强制）
        run: git diff --exit-code -- ui/index.html engine/engine.dist.js
      - name: JSON validity (rules.json)
        run: python -c "import json; d=json.load(open('kb/04-rules-db/rules.json',encoding='utf-8')); print('rules.json OK,', len(d['rules']), 'rules')"
      - name: 回归套件（14 套）
        run: |
          node tools/test_engine.js
          node tools/test_lunar.js
          node tools/test_ui.js
          node tools/test_eval_state.js
          node tools/test_p1_fixes.js
          node tools/verify_sleep_rules.js
          node tools/verify_ux_e2e.js
          node tools/test_dst.js
          node tools/test_liuri_v2.js
          node tools/test_liuyue_v2.js
          node tools/verify_edu_rules.js
          node tools/test_xiyong.js
          node tools/check_conflicts.js
          node tools/check_dup_hits.js
      # 2026-10-12（v1.3.11）新增三道内容/可达性门禁——它们各自对应一次真实漏检：
      #   check_content_lexicon  ← v1.3.9 手工清"必有/血光"没有机器兜底
      #   check_same_condition   ← yongshen_寒月 与 yongshen_暑月 同条件互斥、50.1% 命盘同时命中
      #   check_reachability     ← pattern_专旺_水 缺失、专旺细分规则网格 0 命中
      - name: 内容合规词表（绝对化 / 恐吓性 / 健康兜底 / 性别对冲）
        run: python tools/check_content_lexicon.py
      - name: 同条件多规则（互斥 / 近重复）
        run: node tools/check_same_condition.js
      - name: 断语可达性（固定网格 + 极端样例盘）
        run: node tools/check_reachability.js
      # 2026-10-14（v1.3.15）新增：三张手工维护的大表（724 城经度 / 1900-2099 农历 / 206 年节气）
      #   任一字符写错都会静默算错盘，而 14 套回归都碰不到。--self-test 会注入 4 处故障并要求被抓到
      #   —— 门禁最大的风险不是漏检，是"永远不会失败"。
      - name: 数据表完整性（城市经度 / 农历 / 节气）+ 门禁自检
        run: |
          node tools/check_data_integrity.js
          node tools/check_data_integrity.js --self-test
      - name: 交付包契约（干跑，不写 ZIP）
        run: python tools/build_release_zip.py --check
      - name: Compliance soften + check (C-end gate)
        run: |
          cp engine/engine.dist.js engine/engine.compliance.js
          python tools/compliance_soften.py engine/engine.compliance.js
          python tools/compliance_soften.py engine/engine.compliance.js --check
      # 2026-10-13（v1.3.13）新增：上面那步"能过 --check"并不代表产物正确 ——
      #   原实现是整文件全局替换，把 k==='流年' 改成 k==='年度'、把 id/category/source 一起改了，
      #   而 --check 只看"敏感词是否清干净"，越界改动它一个字都看不出来。
      #   本步用"逐规则标识逐字节相同 + 逐盘 matchRules 命中一致"来卡住软化越界。
      - name: 合规软化版与 dist 行为等价（标识不得被软化）
        run: node tools/check_compliance_equivalence.js
      # 2026-10-14（v1.3.16）：改为跑**裸命令**——与客户拿到交付包后跑的完全一致。
      # 原来写 `--sample=100 --seed=42`，其实是"挑一个能过的样本"：该工具默认 n=80 + 随机种子，
      # 对点估计硬卡 80%，而两条真实命中率 73% 的规则在此样本量下约有 8% 概率显示 >80% → 随机失败。
      # 现已修工具本身（默认 n=300 + 固定种子 42 + 阈值分层：≥90% 才失败、80%~90% 仅警告）。
      - name: Hit distribution audit（裸命令，与客户同路径）
        run: node tools/audit_hit_distribution.js
